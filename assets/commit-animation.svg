<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');

      text {
        font-family: 'Fira Code', monospace, Courier, sans-serif;
        font-size: 13px;
      }

      .prompt { fill: #ef4444; font-weight: 600; }
      .path { fill: #38bdf8; }
      .cmd { fill: #f3f4f6; }
      .output { fill: #9ca3af; }
      .success { fill: #22c55e; font-weight: 600; }
      .accent { fill: #fbbf24; }

      /* Blinking cursor */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #22c55e;
      }

      /* Animated typing / fade-in sequence */
      @keyframes fadeL1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
      @keyframes fadeL2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes fadeL3 { 0%, 50% { opacity: 0; } 55%, 100% { opacity: 1; } }
      @keyframes fadeL4 { 0%, 75% { opacity: 0; } 80%, 100% { opacity: 1; } }

      .line1 { animation: fadeL1 12s infinite; }
      .line2 { animation: fadeL2 12s infinite; }
      .line3 { animation: fadeL3 12s infinite; }
      .line4 { animation: fadeL4 12s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="846" height="216" rx="10" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 838 2 Q 848 2 848 12 L 848 34 L 2 34 Z" fill="#161922" />
  <line x1="2" y1="34" x2="848" y2="34" stroke="#262a36" stroke-width="1" />

  <!-- macOS-style Window Buttons -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="425" y="22" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="600">baadaldev@ubuntu: ~/github-workspace (zsh)</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Git Status -->
  <g class="line1" transform="translate(24, 60)">
    <text class="prompt">❯</text>
    <text x="16" class="path">~/projects</text>
    <text x="110" class="cmd">git status --short</text>
    <text x="0" y="22" class="output">M  README.md | +128 additions, continuous algorithmic progress</text>
  </g>

  <!-- Line 2: Git Commit -->
  <g class="line2" transform="translate(24, 110)">
    <text class="prompt">❯</text>
    <text x="16" class="path">~/projects</text>
    <text x="110" class="cmd">git commit -m "feat(profile): level up DSA, web architectures &amp; achievements"</text>
  </g>

  <!-- Line 3: Git Push & Confirmation -->
  <g class="line3" transform="translate(24, 142)">
    <text class="output">[main a8f9131] pushed to origin/main</text>
    <text x="0" y="20" class="success">✓ Everything up-to-date (0 conflicts, build passing at 100%)</text>
  </g>

  <!-- Line 4: Live Status Banner -->
  <g class="line4" transform="translate(24, 192)">
    <text class="prompt">❯</text>
    <text x="16" class="accent">⚡ Status:</text>
    <text x="96" class="cmd">Open to full-stack &amp; systems collaborations | Code, Commit &amp; Deploy Daily</text>
    <rect x="740" y="-12" width="8" height="15" class="cursor" />
  </g>
</svg>
